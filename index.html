<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友達データ帳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap');

  :root{
    --night: #171b2e;
    --night-2: #1f2440;
    --card: #232a4a;
    --gold: #c9a876;
    --gold-soft: #e8d9b8;
    --rose: #c98a9e;
    --ink: #f2ede1;
    --ink-dim: #b8b4c4;
    --line: rgba(201,168,118,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(201,168,118,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(201,138,158,0.08), transparent 40%),
      var(--night);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    padding:32px 20px 60px;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:20px;text-align:center;}
  header .eyebrow{
    font-size:12px;letter-spacing:.15em;color:var(--gold);
    text-transform:uppercase;margin-bottom:6px;
  }
  header h1{
    font-family:'Shippori Mincho',serif;font-weight:700;
    font-size:28px;margin:0 0 6px;color:var(--gold-soft);
  }
  header p{margin:0;color:var(--ink-dim);font-size:13px;}

  #sync-banner{
    text-align:center;font-size:11px;color:var(--ink-dim);
    margin-bottom:16px;min-height:16px;
  }
  #sync-banner.err{color:var(--rose);}
  #sync-banner.ok{color:#9ad6a0;}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .panel h2{
    font-family:'Shippori Mincho',serif;font-size:16px;font-weight:500;
    color:var(--gold-soft);margin:0 0 16px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .panel h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--night-2);
    color:var(--ink);font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold);}
  .field input::placeholder{color:#6b6a7c;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .unknown-toggle{
    display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-dim);
  }
  .unknown-toggle input{width:auto;padding:0;}

  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-primary{
    width:100%;padding:12px;border-radius:8px;
    background:var(--gold);color:#241d10;font-weight:500;font-size:14px;
    letter-spacing:.02em;
  }
  .btn-primary:hover{background:var(--gold-soft);}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:6px 12px;border-radius:6px;font-size:12px;
  }
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft);}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:140px;padding:9px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--night-2);color:var(--ink);font-size:13px;
  }

  .cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    padding:5px 12px;border-radius:20px;font-size:12px;
    border:1px solid var(--line);color:var(--ink-dim);background:transparent;
  }
  .chip.active{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:500;}
  .chip:hover{border-color:var(--gold);}

  .group-title{
    font-size:12px;letter-spacing:.08em;color:var(--gold);
    margin:18px 0 8px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .group-title:first-child{margin-top:0;}
  .group-title::after{content:'';flex:1;height:1px;background:var(--line);}

  .entry{
    border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .entry .info .name{
    font-family:'Shippori Mincho',serif;font-size:16px;color:var(--gold-soft);margin-bottom:4px;
  }
  .entry .info .meta{font-size:12px;color:var(--ink-dim);line-height:1.8;}
  .entry .actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

  .empty{text-align:center;padding:30px 10px;color:var(--ink-dim);font-size:13px;}
  .empty .star{color:var(--gold);font-size:22px;display:block;margin-bottom:8px;}

  .status{font-size:12px;color:var(--gold-soft);margin-top:10px;min-height:16px;}
  textarea.export-box{
    width:100%;min-height:120px;background:var(--night-2);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font-family:monospace;font-size:11px;padding:10px;
    margin-top:10px;resize:vertical;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">さくらこ｜恋愛占いカウンセラー</div>
    <h1>友達データ帳</h1>
    <p>名前・生年月日・出生時刻・出生地を記録。占いアプリへの取り込み用データ</p>
  </header>

  <div id="sync-banner"></div>

  <div class="panel">
    <h2 id="panel-title"><span class="dot"></span>新しく追加</h2>
    <div class="field">
      <label for="f-name">名前</label>
      <input id="f-name" type="text" placeholder="例）田中花子">
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-date">生年月日</label>
        <input id="f-date" type="text" placeholder="例）1986/8/8 や 19860808">
      </div>
      <div class="field">
        <label for="f-time">出生時刻</label>
        <input id="f-time" type="text" placeholder="例）23:59 や 2359 や 23時59分">
        <div class="unknown-toggle">
          <input id="f-time-unknown" type="checkbox">
          <label for="f-time-unknown" style="margin:0;">時刻不明</label>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="f-category">カテゴリー</label>
      <select id="f-category">
        <option value="未分類">未分類</option>
        <option value="本人">本人</option>
        <option value="友達">友達</option>
        <option value="友達（♂）">友達（♂）</option>
        <option value="親しい友人">親しい友人</option>
        <option value="友達の子供">友達の子供</option>
        <option value="身内">身内</option>
        <option value="先生">先生</option>
        <option value="お客様">お客様</option>
        <option value="仕事関係">仕事関係</option>
        <option value="その他">その他</option>
        <option value="有名人">有名人</option>
        <option value="海外">海外</option>
        <option value="先祖">先祖</option>
        <option value="ヒカル界隈">ヒカル界隈</option>
      </select>
    </div>
    <div class="field">
      <label for="f-place">出生地</label>
      <input id="f-place" type="text" placeholder="例）福岡県福岡市">
    </div>
    <div class="field">
      <label for="f-memo">MEMO</label>
      <textarea id="f-memo" placeholder="性格・エピソード・鑑定メモなど自由に" rows="3"></textarea>
    </div>
    <button class="btn-primary" id="add-btn">追加する</button>
    <button class="btn-ghost" id="cancel-edit-btn" style="display:none;width:100%;margin-top:8px;">キャンセル</button>
    <div class="status" id="add-status"></div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>登録済みリスト（<span id="count">0</span>件）</h2>
    <div class="toolbar">
      <input class="search" id="search" type="text" placeholder="名前で検索">
      <button class="btn-ghost" id="export-json-btn">JSONで出力</button>
      <button class="btn-ghost" id="export-csv-btn">CSVで出力</button>
      <button class="btn-ghost" id="import-toggle-btn">JSONを貼り付けて統合</button>
    </div>
    <div id="export-copy-status" class="status" style="margin-bottom:4px;"></div>
    <textarea class="export-box" id="export-box" style="display:none;"></textarea>
    <div id="import-panel" style="display:none;margin-bottom:16px;">
      <div class="field">
        <label for="import-box">他で出力したJSONをここに貼り付けてください</label>
        <textarea class="export-box" id="import-box" style="display:block;"></textarea>
      </div>
      <button class="btn-ghost" id="import-merge-btn">貼り付けた内容を統合する（名前が一致する人は更新）</button>
      <div class="status" id="import-status"></div>
    </div>
    <div class="cat-filter" id="cat-filter"></div>
    <div id="cat-export-bar" style="display:none;margin-bottom:12px;">
      <button class="btn-ghost" id="export-category-btn"></button>
    </div>
    <div id="selection-bar" style="display:none;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--gold-soft);flex-wrap:wrap;">
      <span id="selection-count"></span>
      <button class="btn-ghost" id="export-selected-btn">選択した人だけJSONで出力</button>
      <button class="btn-ghost" id="clear-selection-btn">選択解除</button>
    </div>
    <div id="list"></div>
  </div>

</div>

<script>

const INITIAL_DATA = [{"id": "f01", "name": "うさみくん", "date": "1993-03-28", "time": "", "timeUnknown": true, "place": "", "category": "友達（♂）", "memo": "", "visible": true, "addedAt": 0}, {"id": "f02", "name": "きゃん", "date": "1986-05-19", "time": "13:57", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f03", "name": "やぁちゃん", "date": "1987-03-23", "time": "01:30", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f04", "name": "あやこ", "date": "1987-01-27", "time": "19:59", "timeUnknown": false, "place": "福島", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f05", "name": "あっちゃん", "date": "1986-06-06", "time": "08:21", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f06", "name": "りいちゃん", "date": "1997-02-27", "time": "17:41", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f07", "name": "まゆこりん", "date": "1986-08-08", "time": "23:59", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f08", "name": "そらちゃん", "date": "1986-11-17", "time": "01:44", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f09", "name": "まきのっち", "date": "1986-12-15", "time": "23:56", "timeUnknown": false, "place": "宮崎", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f10", "name": "まどかちゃん", "date": "1989-02-07", "time": "16:27", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f11", "name": "さわちゃん", "date": "1991-12-06", "time": "16:48", "timeUnknown": false, "place": "福岡", "category": "親しい友人", "memo": "", "visible": true, "addedAt": 0}, {"id": "f12", "name": "牡丹先生", "date": "1980-05-09", "time": "16:00", "timeUnknown": false, "place  "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f25", "name": "愛C", "date": "1986-10-06", "time": "07:32", "timeUnknown": false, "place": "長崎", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f26", "name": "えりこ", "date": "1986-10-10", "time": "23:15", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f27", "name": "ひかり", "date": "1986-10-29", "time": "06:46", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f28", "name": "あーC", "date": "1989-06-22", "time": "22:03", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f29", "name": "えりさん", "date": "1974-03-14", "time": "01:30", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f30", "name": "オーバ", "date": "1987-03-21", "time": "00:15", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}, {"id": "f31", "name": "美穂さん", "date": "1969-04-09", "time": "13:00", "timeUnknown": false, "place": "福岡", "category": "友達", "memo": "", "visible": true, "addedAt": 0}];
const INITIAL_DATA_GENERATED_AT = "2026-08-29 16:26";

let friends = INITIAL_DATA.slice();
let editingId = null;
let activeCategory = 'すべて';
let selectedIds = new Set();

function fmtDate(d){
  if(!d) return '未設定';
  const [y,m,dd] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(dd)}日`;
}
function fmtTime(t, unknown){
  if(unknown || !t) return '時刻不明';
  return t;
}

function parseDateInput(str){
  if(!str || !str.trim()) return '';
  let cleaned = str.trim();
  if(/^\d{8}$/.test(cleaned)){
    const y = cleaned.slice(0,4), mo = cleaned.slice(4,6), d = cleaned.slice(6,8);
    return `${y}-${mo}-${d}`;
  }
  cleaned = cleaned.replace(/[／．]/g, '/').replace(/[年月]/g, '/').replace(/日/g, '');
  const m = cleaned.match(/(\d{4})\D+(\d{1,2})\D*(\d{1,2})?/);
  if(!m || !m[3]) return null;
  const y = m[1], mo = m[2].padStart(2,'0'), d = m[3].padStart(2,'0');
  return `${y}-${mo}-${d}`;
}

function parseTimeInput(str){
  if(!str || !str.trim()) return '';
  let cleaned = str.trim();
  if(/^\d{1,4}$/.test(cleaned)){
    let h, mi;
    if(cleaned.length <= 2){ h = cleaned; mi = '0'; }
    else if(cleaned.length === 3){ h = cleaned.slice(0,1); mi = cleaned.slice(1); }
    else { h = cleaned.slice(0,2); mi = cleaned.slice(2); }
    h = h.padStart(2,'0'); mi = mi.padStart(2,'0');
    if(parseInt(h) > 23 || parseInt(mi) > 59) return null;
    return `${h}:${mi}`;
  }
  cleaned = cleaned.replace(/：/g, ':').replace(/時/g, ':').replace(/分/g, '');
  const m = cleaned.match(/(\d{1,2})\D*(\d{1,2})?/);
  if(!m) return null;
  const h = m[1].padStart(2,'0');
  const mi = (m[2] || '0').padStart(2,'0');
  if(parseInt(h) > 23 || parseInt(mi) > 59) return null;
  return `${h}:${mi}`;
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   サーバーAPIとの通信
   ============================================================ */
function setSyncBanner(text, kind){
  const el = document.getElementById('sync-banner');
  el.textContent = text;
  el.className = kind || '';
}

async function loadFromServer(){
  try{
    const res = await fetch('/api/data', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(Array.isArray(data)){
      // サーバーが空配列（まだ何も保存されていない）の場合は、
      // 埋め込み初期データを表示済みのまま保持する（消さない）
      if(data.length > 0){
        friends = data;
      }
      render();
      setSyncBanner('最新データを取得しました', 'ok');
      setTimeout(() => setSyncBanner(''), 2500);
    }
  }catch(e){
    // 取得に失敗しても、表示済みのデータは絶対に消さない・置き換えない
    setSyncBanner('⚠ 最新データの取得に失敗しました（表示中の内容は最新でない可能性があります）', 'err');
  }
}

async function saveToServer(){
  try{
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(friends)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }catch(e){
    setSyncBanner('⚠ 保存に失敗しました（オフラインの可能性があります。もう一度お試しください）', 'err');
    return false;
  }
}

/* ============================================================
   描画
   ============================================================ */
function render(){
  const list = document.getElementById('list');
  const q = document.getElementById('search').value.trim().toLowerCase();
  document.getElementById('count').textContent = friends.length;

  renderCategoryFilter();

  let filtered = friends.filter(f => f.name.toLowerCase().includes(q));
  if(activeCategory !== 'すべて'){
    filtered = filtered.filter(f => (f.category || '未分類') === activeCategory);
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><span class="star">＊</span>${friends.length===0 ? 'まだ登録がありません。上のフォームから追加してください。' : '該当する友達が見つかりません。'}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(f => {
    const cat = f.category || '未分類';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(f);
  });

  const catOrder = Object.keys(groups).sort((a,b) => {
    if(a === '本人') return 1;
    if(b === '本人') return -1;
    if(a === '未分類') return 1;
    if(b === '未分類') return -1;
    return a.localeCompare(b, 'ja');
  });

  list.innerHTML = catOrder.map(cat => `
    <div class="group-title" style="display:flex;align-items:center;gap:8px;">
      <span>${escapeHtml(cat)}（${groups[cat].length}）</span>
      <button class="cat-vis-btn" data-cat="${escapeHtml(cat)}" data-vis="true" style="font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;">全員表示</button>
      <button class="cat-vis-btn" data-cat="${escapeHtml(cat)}" data-vis="false" style="font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;">全員非表示</button>
    </div>
    ${groups[cat].map(f => `
      <div class="entry" data-id="${f.id}" style="${f.visible === false ? 'opacity:.5;' : ''}">
        <input type="checkbox" class="select-check" data-id="${f.id}" ${selectedIds.has(f.id) ? 'checked' : ''} style="width:auto;margin-top:3px;flex-shrink:0;accent-color:var(--gold);">
        <div class="info">
          <div class="name">${escapeHtml(f.name)}${f.visible === false ? ' <span style="font-size:10px;color:var(--rose);">（統合アプリ非表示）</span>' : ''}</div>
          <div class="meta">
            生年月日：${fmtDate(f.date)}<br>
            出生時刻：${fmtTime(f.time, f.timeUnknown)}<br>
            出生地：${escapeHtml(f.place) || '未設定'}
            ${f.memo ? `<br><span style="color:var(--gold-soft);">MEMO：</span>${escapeHtml(f.memo).replace(/\n/g,'<br>')}` : ''}
          </div>
        </div>
        <div class="actions">
          <button class="btn-ghost vis-toggle-btn" data-id="${f.id}">${f.visible === false ? '表示する' : '非表示にする'}</button>
          <button class="btn-ghost edit-btn" data-id="${f.id}">編集</button>
          <button class="btn-ghost del-btn" data-id="${f.id}">削除</button>
        </div>
      </div>
    `).join('')}
  `).join('');

  list.querySelectorAll('.cat-vis-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cat = btn.getAttribute('data-cat');
      const vis = btn.getAttribute('data-vis') === 'true';
      friends.forEach(f => { if((f.category || '未分類') === cat) f.visible = vis; });
      await saveToServer();
      render();
    });
  });

  list.querySelectorAll('.vis-toggle-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const f = friends.find(x => x.id === id);
      if(!f) return;
      f.visible = f.visible === false ? true : false;
      await saveToServer();
      render();
    });
  });

  list.querySelectorAll('.select-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.getAttribute('data-id');
      if(cb.checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateSelectionStatus();
    });
  });

  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const f = friends.find(x => x.id === id);
      if(!f) return;
      editingId = id;
      document.getElementById('f-name').value = f.name || '';
      document.getElementById('f-date').value = f.date ? f.date.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_,y,m,d)=>`${y}/${parseInt(m)}/${parseInt(d)}`) : '';
      document.getElementById('f-time').value = f.time || '';
      document.getElementById('f-time-unknown').checked = !!f.timeUnknown;
      document.getElementById('f-category').value = f.category || '未分類';
      document.getElementById('f-place').value = f.place || '';
      document.getElementById('f-memo').value = f.memo || '';
      document.getElementById('add-btn').textContent = '更新する';
      document.getElementById('cancel-edit-btn').style.display = 'inline-block';
      document.getElementById('panel-title').textContent = `編集中：${f.name}`;
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      friends = friends.filter(f => f.id !== id);
      selectedIds.delete(id);
      await saveToServer();
      render();
    });
  });
}

function renderCategoryFilter(){
  const cats = Array.from(new Set(friends.map(f => f.category || '未分類')));
  cats.sort((a,b) => {
    if(a === '本人') return 1;
    if(b === '本人') return -1;
    if(a === '未分類') return 1;
    if(b === '未分類') return -1;
    return a.localeCompare(b, 'ja');
  });

  const filterEl = document.getElementById('cat-filter');
  const all = ['すべて', ...cats];
  if(!all.includes(activeCategory)) activeCategory = 'すべて';

  filterEl.innerHTML = all.map(c =>
    `<button class="chip${c === activeCategory ? ' active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
  filterEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.getAttribute('data-cat');
      render();
    });
  });

  const exportBar = document.getElementById('cat-export-bar');
  const exportBtn = document.getElementById('export-category-btn');
  if(activeCategory === 'すべて'){
    exportBar.style.display = 'none';
  } else {
    exportBar.style.display = 'block';
    const countInCat = friends.filter(f => (f.category || '未分類') === activeCategory).length;
    exportBtn.textContent = `「${activeCategory}」（${countInCat}人）をJSONで出力`;
  }
}

function updateSelectionStatus(){
  const bar = document.getElementById('selection-bar');
  const countEl = document.getElementById('selection-count');
  if(selectedIds.size === 0){
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  countEl.textContent = `${selectedIds.size}人を選択中`;
}

/* ============================================================
   クリップボードコピー
   ============================================================ */
async function copyExportText(text, label){
  const box = document.getElementById('export-box');
  const statusEl = document.getElementById('export-copy-status');
  box.style.display = 'block';
  box.value = text;
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = `${label}をコピーしました！そのまま貼り付けできます。`;
    box.select();
  }catch(e){
    box.select();
    try{
      document.execCommand('copy');
      statusEl.textContent = `${label}をコピーしました！そのまま貼り付けできます。`;
    }catch(e2){
      statusEl.textContent = `自動コピーできませんでした。上の欄の内容を選択してコピーしてください。`;
    }
  }
  setTimeout(() => { statusEl.textContent=''; }, 4000);
}

/* ============================================================
   フォーム操作
   ============================================================ */
function resetForm(){
  document.getElementById('f-name').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-time').value = '';
  document.getElementById('f-time-unknown').checked = false;
  document.getElementById('f-category').value = '未分類';
  document.getElementById('f-place').value = '';
  document.getElementById('f-memo').value = '';
  editingId = null;
  document.getElementById('add-btn').textContent = '追加する';
  document.getElementById('cancel-edit-btn').style.display = 'none';
  document.getElementById('panel-title').textContent = '新しく追加';
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const name = document.getElementById('f-name').value.trim();
  const dateRaw = document.getElementById('f-date').value;
  const timeRaw = document.getElementById('f-time').value;
  const timeUnknown = document.getElementById('f-time-unknown').checked;
  const category = document.getElementById('f-category').value || '未分類';
  const place = document.getElementById('f-place').value.trim();
  const memo = document.getElementById('f-memo').value.trim();
  const statusEl = document.getElementById('add-status');

  if(!name){
    statusEl.textContent = '名前を入力してください。';
    return;
  }
  const date = parseDateInput(dateRaw);
  if(date === null){
    statusEl.textContent = '生年月日の形式が読み取れません。例）1986/8/8 のように入力してください。';
    return;
  }
  let time = '';
  if(!timeUnknown){
    time = parseTimeInput(timeRaw);
    if(time === null){
      statusEl.textContent = '出生時刻の形式が読み取れません。例）23:59 または 23時59分';
      return;
    }
  }

  if(editingId){
    const idx = friends.findIndex(f => f.id === editingId);
    if(idx !== -1){
      friends[idx] = { ...friends[idx], name, date, time, timeUnknown, category, place, memo };
    }
    await saveToServer();
    render();
    statusEl.textContent = `${name}さんを更新しました。`;
    resetForm();
  } else {
    friends.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name, date, time, timeUnknown, category, place, memo,
      addedAt: Date.now(), visible: true
    });
    await saveToServer();
    render();
    statusEl.textContent = `${name}さんを追加しました。`;
    resetForm();
  }
  setTimeout(() => { statusEl.textContent=''; }, 3500);
});

document.getElementById('cancel-edit-btn').addEventListener('click', () => {
  resetForm();
  document.getElementById('add-status').textContent = '';
});

document.getElementById('search').addEventListener('input', render);

/* ============================================================
   出力（コピー）系
   ============================================================ */
document.getElementById('export-json-btn').addEventListener('click', () => {
  copyExportText(JSON.stringify(friends, null, 2), '全員分のJSON');
});

document.getElementById('export-csv-btn').addEventListener('click', () => {
  const header = '名前,カテゴリー,生年月日,出生時刻,出生地,MEMO\n';
  const rows = friends.map(f =>
    `${f.name},${f.category||'未分類'},${f.date||''},${f.timeUnknown ? '不明' : (f.time||'')},${f.place||''},"${(f.memo||'').replace(/"/g,'""')}"`
  ).join('\n');
  copyExportText(header + rows, 'CSV');
});

document.getElementById('export-category-btn').addEventListener('click', () => {
  const inCat = friends.filter(f => (f.category || '未分類') === activeCategory);
  copyExportText(JSON.stringify(inCat, null, 2), `「${activeCategory}」${inCat.length}人分`);
});

document.getElementById('export-selected-btn').addEventListener('click', () => {
  const selected = friends.filter(f => selectedIds.has(f.id));
  copyExportText(JSON.stringify(selected, null, 2), `選択した${selected.length}人分`);
});

document.getElementById('clear-selection-btn').addEventListener('click', () => {
  selectedIds.clear();
  render();
});

/* ============================================================
   他所からのJSON貼り付け統合（任意の補助機能）
   ============================================================ */
document.getElementById('import-toggle-btn').addEventListener('click', () => {
  const panel = document.getElementById('import-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('import-merge-btn').addEventListener('click', async () => {
  const raw = document.getElementById('import-box').value.trim();
  const statusEl = document.getElementById('import-status');
  if(!raw){
    statusEl.textContent = '貼り付ける内容がありません。';
    return;
  }
  let parsed;
  try{
    parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error('not array');
  }catch(e){
    statusEl.textContent = 'JSON形式が正しく読み取れませんでした。';
    return;
  }

  const nameIndex = {};
  friends.forEach((f, i) => { nameIndex[f.name] = i; });
  let added = 0, updated = 0;
  parsed.forEach(f => {
    if(!f || !f.name) return;
    if(nameIndex.hasOwnProperty(f.name)){
      friends[nameIndex[f.name]] = { ...friends[nameIndex[f.name]], ...f };
      updated++;
    } else {
      friends.push({
        id: f.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
        name: f.name, date: f.date || '', time: f.time || '',
        timeUnknown: !!f.timeUnknown, category: f.category || '未分類',
        place: f.place || '', memo: f.memo || '',
        addedAt: f.addedAt || Date.now(),
        visible: f.visible === undefined ? true : f.visible
      });
      nameIndex[f.name] = friends.length - 1;
      added++;
    }
  });

  await saveToServer();
  render();
  statusEl.textContent = `新規${added}人・更新${updated}人。合計${friends.length}人になりました。`;
  document.getElementById('import-box').value = '';
});

/* ============================================================
   初期化
   ============================================================ */
render();
loadFromServer();
</script>
</body>
